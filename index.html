<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Dashboard Sulax U2</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Arial, sans-serif; background:#0b0f1a; color:white; }

  .header {
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;
    gap:10px; padding:10px 20px; background:#111827; font-size:22px;
  }
  #status { font-size:14px; color:#fbbf24; }
  #status.error { color:#f87171; }

  .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:10px; }
  .tile {
    padding:20px; border-radius:12px; text-align:center;
    background:linear-gradient(135deg,#1f2937,#111827); font-size:18px;
  }

  .controls { text-align:center; padding:10px; }
  .controls button, .controls input { padding:8px; margin:5px; border:none; border-radius:6px; }
  .controls button { cursor:pointer; }
  #pageCount { margin:0 8px; color:#9ca3af; }

  .page { display:none; padding:15px; }
  .active { display:block; }

  .page-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; gap:10px; flex-wrap:wrap; }
  .center { text-align:center; margin-bottom:20px; }

  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border:1px solid #374151; padding:6px; text-align:center; }
  th { background:#1f2937; }
  .ok { background:#065f46; }
  .bad { background:#7f1d1d; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.4; } }

  .chart-row { display:flex; gap:20px; margin-top:20px; }
  .chart-box { flex:1; height:420px; background:#111827; padding:15px; border-radius:12px; }
  .chart-wrap { position:relative; height:100%; }

  .nodata { text-align:center; font-size:22px; padding:40px; color:#f87171; }

  @media (max-width:800px) {
    .tiles { grid-template-columns:repeat(2,1fr); }
    .chart-row { flex-direction:column; }
    .chart-box { height:340px; }
  }
</style>
</head>
<body>

<div class="header">
  <div>📊 DISPATCH DASHBOARD SULAX U2</div>
  <div id="status"></div>
  <div id="clock"></div>
</div>

<div class="tiles">
  <div class="tile" id="sch"></div>
  <div class="tile" id="disp"></div>
  <div class="tile" id="pending"></div>
  <div class="tile" id="ach"></div>
</div>

<div class="controls">
  <button onclick="prevSlide()">⏮</button>
  <button onclick="pauseSlide()">⏸</button>
  <button onclick="playSlide()">▶</button>
  <button onclick="nextSlide()">⏭</button>
  <span id="pageCount"></span>

  📅
  <input type="date" id="datePicker" onchange="applyDateFilter()">

  <button onclick="showToday()">Today</button>
  <button onclick="showMonthToDate()">UpToDate</button>
  <button onclick="showAll()">All</button>
</div>

<div id="pages"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTbUHI5wjkXOhcPmnfz5PBhg_aLWHqARzFyhYnZKnajvO9gpDFp-G8qd5U-t3lFKEASNb4jPN3gK3HD/pub?output=csv";
const REFRESH_MS = 5 * 60 * 1000;   // reload sheet every 5 minutes
const SLIDE_MS   = 10 * 1000;       // slide rotation
const COL = { total:"#3b82f6", disp:"#22c55e", pending:"#ef4444" };
const BAR_MAX_PX = 60;              // maximum bar width in pixels (smaller = thinner)

// ============================================================
// STATE
// ============================================================
let data = [];          // every row from the sheet
let filtered = [];      // rows for the current filter
let headers = [];       // column names from the sheet
let pages = [];         // { el, init, done }
let current = 0;
let timer = null;
let paused = false;
let charts = [];
let chartSeq = 0;
let filter = { type:"all" };

// ============================================================
// HELPERS
// ============================================================
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const fmtN = n => Number(n).toLocaleString("en-IN");

// "1,250" -> 1250 ; "" or junk -> 0
const num = v => Number(String(v ?? "").replace(/[,\s]/g, "")) || 0;

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

// Build "YYYY-MM-DD" only if the date really exists (rejects 11/25/2026 misread as d/m)
function keyOf(y, m, d) {
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return "";
  return `${y}-${pad(m)}-${pad(d)}`;
}
// Local calendar date (NOT toISOString, which is UTC)
const localKey = d => keyOf(d.getFullYear(), d.getMonth() + 1, d.getDate());
// "2026-11-25" -> "25/11/2026"
const fmtKey = k => k ? `${k.slice(8, 10)}/${k.slice(5, 7)}/${k.slice(0, 4)}` : "";

// Accepts yyyy-mm-dd, yyyy/mm/dd, dd/mm/yyyy, dd-mm-yyyy, dd.mm.yy and anything with a time after it
function dateKey(raw) {
  const s = String(raw ?? "").trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if (m) return keyOf(+m[1], +m[2], +m[3]);
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4}|\d{2})(?!\d)/);
  if (m) {
    const y = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
    return keyOf(y, +m[2], +m[1]);      // day first
  }
  const d = new Date(s);                // last resort, e.g. "25-Nov-2026"
  return isNaN(d) ? "" : localKey(d);
}

const dispQty = r => num(r["DES QTY"] || r["DISP QTY"]);

// ============================================================
// CSV PARSER (handles quotes, "" escapes, commas and CRLF)
// ============================================================
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const rows = [];
  let row = [], val = "", inQuote = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuote) {
      if (c === '"') {
        if (text[i + 1] === '"') { val += '"'; i++; }   // escaped quote
        else inQuote = false;
      } else val += c;
    } else if (c === '"') {
      inQuote = true;
    } else if (c === ",") {
      row.push(val); val = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(val); rows.push(row);
      row = []; val = "";
    } else {
      val += c;
    }
  }
  if (val !== "" || row.length) { row.push(val); rows.push(row); }

  const hdr = (rows.shift() || []).map(h => h.trim().toUpperCase());
  headers = hdr;

  return rows
    .filter(r => r.some(v => v.trim() !== ""))
    .map(r => {
      const o = {};
      hdr.forEach((h, i) => { o[h] = (r[i] ?? "").trim(); });
      o._key = dateKey(o["SCHEDULE DATE"]);
      return o;
    });
}

// ============================================================
// LOAD (with HTTP check and periodic refresh)
// ============================================================
function setStatus(msg, isError = false) {
  const el = $("status");
  el.textContent = msg;
  el.className = isError ? "error" : "";
}

async function load() {
  try {
    const res = await fetch(SHEET_URL + "&_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const parsed = parseCSV(await res.text());
    if (!headers.includes("CUSTOMER") || !headers.includes("SCHEDULE DATE")) {
      throw new Error("sheet columns not found (is the link still published?)");
    }

    data = parsed;
    setStatus("Updated " + new Date().toLocaleTimeString("en-IN"));
    applyFilter();
  } catch (err) {
    setStatus("⚠️ Refresh failed: " + err.message + (data.length ? " (showing last data)" : ""), true);
    if (!data.length) applyFilter();
  }
}

// ============================================================
// FILTERS
// ============================================================
function applyFilter() {
  const today = localKey(new Date());
  const ym = today.slice(0, 7);

  if (filter.type === "today") $("datePicker").value = today;

  filtered = data.filter(r => {
    switch (filter.type) {
      case "date":  return r._key === filter.key;
      case "today": return r._key === today;
      case "mtd":   return r._key.startsWith(ym) && r._key <= today;
      default:      return true;
    }
  });

  build();
}

function setFilter(f) {
  filter = f;
  current = 0;
  applyFilter();
}

function applyDateFilter() {
  const v = $("datePicker").value;           // already yyyy-mm-dd
  setFilter(v ? { type:"date", key:v } : { type:"all" });
}

function showToday() {
  $("datePicker").value = localKey(new Date());
  setFilter({ type:"today" });
}

function showMonthToDate() {
  $("datePicker").value = "";
  setFilter({ type:"mtd" });
}

function showAll() {
  $("datePicker").value = "";
  setFilter({ type:"all" });
}

// ============================================================
// GROUPING & TILES
// ============================================================
function groupByCustomer(rows) {
  const map = new Map();
  rows.forEach(r => {
    const name = r["CUSTOMER"] || "Unknown";
    if (!map.has(name)) map.set(name, { name, rows:[], total:0, disp:0, keys:[] });
    const g = map.get(name);
    g.rows.push(r);
    g.total += num(r["SCH QTY"]);
    g.disp  += dispQty(r);
    if (r._key) g.keys.push(r._key);
  });
  return [...map.values()];
}

function updateTiles() {
  const sch  = filtered.reduce((s, r) => s + num(r["SCH QTY"]), 0);
  const disp = filtered.reduce((s, r) => s + dispQty(r), 0);

  $("sch").textContent     = "Scheduled: " + fmtN(sch);
  $("disp").textContent    = "Dispatched: " + fmtN(disp);
  $("pending").textContent = "Pending: " + fmtN(sch - disp);
  $("ach").textContent     = "Ach %: " + (sch ? ((disp / sch) * 100).toFixed(1) : "0.0") + "%";
}

// ============================================================
// TABLE
// ============================================================
function tableHTML(rows) {
  let html = "<table><tr>" + headers.map(h => `<th>${esc(h)}</th>`).join("") + "</tr>";

  rows.forEach(r => {
    const sch  = num(r["SCH QTY"]);
    const disp = dispQty(r);
    const remark = String(r["REMARKS"] || "").trim().toUpperCase();
    const cls = (remark === "READY" || remark === "DISPATCHED" || sch === disp) ? "ok" : "bad";

    html += `<tr class="${cls}">` +
            headers.map(h => `<td>${esc(r[h] || "-")}</td>`).join("") +
            "</tr>";
  });

  return html + "</table>";
}

// ============================================================
// CHART HELPERS
// ============================================================
// Draws the value above each bar. Registered as a plugin so it works in Chart.js 4.
const valueLabels = {
  id: "valueLabels",
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = "bold 12px Arial";
    ctx.fillStyle = "white";
    ctx.textAlign = "center";
    ctx.textBaseline = "bottom";
    chart.data.datasets.forEach((ds, i) => {
      chart.getDatasetMeta(i).data.forEach((bar, idx) => {
        ctx.fillText(fmtN(ds.data[idx]), bar.x, bar.y - 5);
      });
    });
    ctx.restore();
  }
};

// Created only when its slide is shown, so the canvas has a real size
function barChart(canvasId, labels, datasets, title) {
  if (typeof Chart === "undefined") {
    setStatus("⚠️ Chart library did not load – check internet connection", true);
    return;
  }
  const canvas = $(canvasId);
  if (!canvas) return;
  // Thinner bars: capped width and a gap between bars
  const thinDatasets = datasets.map(d => ({
    barPercentage: 0.6,
    categoryPercentage: 0.6,
    maxBarThickness: BAR_MAX_PX,
    ...d
  }));

  const chart = new Chart(canvas, {
    type: "bar",
    data: { labels, datasets: thinDatasets },
    plugins: [valueLabels],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        title:  { display: true, text: title, color: "white", font: { size: 16 } },
        legend: { labels: { color: "white" } }
      },
      scales: {
        x: { ticks: { color: "white" } },
        y: { beginAtZero: true, ticks: { color: "white" }, grid: { color: "#374151" } }
      }
    }
  });
  charts.push(chart);
}

function destroyCharts() {
  charts.forEach(c => c.destroy());
  charts = [];
}

// ============================================================
// SLIDES
// ============================================================
function addPage(host, el, init) {
  host.appendChild(el);
  pages.push({ el, init, done: false });
}

function createSlides(host) {
  groupByCustomer(filtered).forEach(g => {

    // ---- date text: one date, or first → last when the month view spans several days
    const keys = g.keys.slice().sort();
    let dateText = "—";
    if (keys.length) {
      dateText = keys[0] === keys[keys.length - 1]
        ? fmtKey(keys[0])
        : fmtKey(keys[0]) + " → " + fmtKey(keys[keys.length - 1]);
    }

    // ---- TABLE SLIDE
    const tableDiv = document.createElement("div");
    tableDiv.className = "page";
    tableDiv.innerHTML = `
      <div class="page-head">
        <h2>${esc(g.name)}</h2>
        <h2>📅 ${esc(dateText)}</h2>
      </div>
      <div class="table-wrap">${tableHTML(g.rows)}</div>`;
    addPage(host, tableDiv, null);

    // ---- CHART SLIDE
    const id = "chart_" + (++chartSeq);
    const chartDiv = document.createElement("div");
    chartDiv.className = "page";
    chartDiv.innerHTML = `
      <h2 class="center">📊 ${esc(g.name)} ANALYSIS</h2>
      <div class="chart-row">
        <div class="chart-box"><div class="chart-wrap"><canvas id="${id}"></canvas></div></div>
      </div>`;
    addPage(host, chartDiv, () => barChart(
      id,
      ["TOTAL QTY", "DISPATCHED", "PENDING"],
      [{
        label: g.name,
        data: [g.total, g.disp, g.total - g.disp],
        backgroundColor: [COL.total, COL.disp, COL.pending]
      }],
      g.name + " DISPATCH STATUS"
    ));
  });
}

function createFinalChartSlide(host) {
  const groups = groupByCustomer(filtered);
  const labels = groups.map(g => g.name);

  const div = document.createElement("div");
  div.className = "page";
  div.innerHTML = `
    <h2 class="center">📊 ALL CUSTOMER ANALYSIS</h2>
    <div class="chart-row">
      <div class="chart-box"><div class="chart-wrap"><canvas id="allCustomerChart"></canvas></div></div>
    </div>`;

  addPage(host, div, () => barChart(
    "allCustomerChart",
    labels,
    [
      { label:"TOTAL",      data: groups.map(g => g.total),             backgroundColor: COL.total },
      { label:"DISPATCHED", data: groups.map(g => g.disp),              backgroundColor: COL.disp },
      { label:"PENDING",    data: groups.map(g => g.total - g.disp),    backgroundColor: COL.pending }
    ],
    "ALL CUSTOMER STATUS"
  ));
}

// ============================================================
// BUILD
// ============================================================
function build() {
  destroyCharts();
  const host = $("pages");
  host.innerHTML = "";
  pages = [];

  updateTiles();

  if (!filtered.length) {
    host.innerHTML = `<div class="nodata">⚠️ No data for this selection</div>`;
    $("pageCount").textContent = "";
    return;
  }

  createSlides(host);
  createFinalChartSlide(host);
  show(current);
  if (!paused) playSlide();
}

// ============================================================
// SLIDE CONTROL
// ============================================================
function show(i) {
  if (!pages.length) { $("pageCount").textContent = ""; return; }

  current = ((i % pages.length) + pages.length) % pages.length;
  pages.forEach((p, idx) => p.el.classList.toggle("active", idx === current));

  const p = pages[current];
  if (p.init && !p.done) { p.done = true; p.init(); }

  $("pageCount").textContent = `${current + 1} / ${pages.length}`;
}

function nextSlide() { show(current + 1); }
function prevSlide() { show(current - 1); }

function playSlide() {
  paused = false;
  clearInterval(timer);
  if (pages.length) timer = setInterval(nextSlide, SLIDE_MS);
}

function pauseSlide() {
  paused = true;
  clearInterval(timer);
}

// ============================================================
// CLOCK & START
// ============================================================
setInterval(() => {
  $("clock").textContent = new Date().toLocaleString("en-IN");
}, 1000);

load();
setInterval(load, REFRESH_MS);
</script>

</body>
</html>
